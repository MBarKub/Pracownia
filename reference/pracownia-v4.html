<title>Pracownia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: biurko (tło) + arkusz roboczy (powierzchnia) — panel boczny na biurku, treść na arkuszu */
:root{
  --bg:#ECEEEA; --surface:#FAFBF8; --surface-2:#E3E6E0; --text:#1A1F1C; --muted:#636B66; --border:#D2D7D0;
  --accent:#2E55D4; --accent-text:#FFFFFF;
  --ok:#2C8553; --warn:#B8730F; --bad:#C23F38;
  --f-display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --f-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius:10px; --d:1;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
  --hover:color-mix(in srgb, var(--text) 6%, transparent);
  --shadow:0 1px 2px color-mix(in srgb, var(--text) 8%, transparent), 0 8px 28px -12px color-mix(in srgb, var(--text) 22%, transparent);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1A1F1C; --surface-2:#242A26; --text:#E5E9E4; --muted:#939B95; --border:#2E3530;
  --accent:#7E9BFF; --accent-text:#0D1330; --ok:#5DBE88; --warn:#E2A447; --bad:#EF7A71; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A1F1C; --surface-2:#242A26; --text:#E5E9E4; --muted:#939B95; --border:#2E3530;
  --accent:#7E9BFF; --accent-text:#0D1330; --ok:#5DBE88; --warn:#E2A447; --bad:#EF7A71; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.ic{flex:none; display:block}
.ic.dots{stroke-width:3}
kbd{font-family:var(--f-mono); font-size:10.5px; padding:1px 5px; border:1px solid var(--border); border-radius:5px; color:var(--muted); background:var(--surface)}
.eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}

/* ===== shell ===== */
.app{display:grid; grid-template-columns:252px minmax(0,1fr); height:100%}
.side{display:flex; flex-direction:column; gap:14px; padding-block:18px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:12px; overflow-y:auto; min-height:0}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:700; font-size:19px; letter-spacing:-.02em; padding:2px 6px 4px}
.brand-mark{width:22px; height:22px; display:grid; grid-template-columns:1fr 1fr; gap:3px}
.brand-mark i{border-radius:3px; background:var(--accent)}
.brand-mark i:nth-child(2){opacity:.55}.brand-mark i:nth-child(3){opacity:.3}.brand-mark i:nth-child(4){opacity:.8}
.btn-new{display:flex; align-items:center; gap:8px; justify-content:space-between; background:var(--accent); color:var(--accent-text); font-weight:600; padding:10px 12px; border-radius:var(--radius)}
.btn-new span{display:flex; align-items:center; gap:8px}
.btn-new kbd{background:transparent; color:inherit; border-color:color-mix(in srgb, var(--accent-text) 40%, transparent)}
.side-search{display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); color:var(--muted); background:var(--surface)}
.side-search kbd{margin-left:auto}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-i{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:calc(var(--radius) - 2px); color:var(--text); font-weight:500; text-align:left; width:100%}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--surface); box-shadow:var(--shadow)}
.nav-i .count{margin-left:auto; font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.nav-i .count.hot{color:var(--bad)}
.side-sec{display:flex; flex-direction:column; gap:4px}
.side-sec .eyebrow{padding:0 10px 4px}
.side-proj{display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:8px; text-align:left; width:100%; font-size:14px}
.side-proj:hover{background:var(--hover)}
.side-proj.on{background:var(--surface)}
.side-proj .dot{width:9px; height:9px; border-radius:3px; background:var(--pc); flex:none}
.side-proj span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:2px; padding-top:8px}
.sync{font-size:12px; color:var(--muted); padding:6px 10px; display:flex; gap:8px; align-items:center}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none}
.sync.off i{background:var(--warn)}

.main-wrap{min-width:0; min-height:0; padding:10px 10px 10px 0; display:flex}
.main{flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:calc(var(--radius) + 6px); overflow-y:auto; overscroll-behavior:contain}
.page{max-width:1080px; margin:0 auto; padding-block:36px 80px; padding-left:max(28px, env(safe-area-inset-left,0px)); padding-right:max(28px, env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:28px}
.page.narrow{max-width:820px}

.topbar,.tabbar{display:none}

/* ===== typography ===== */
h1,h2,h3{font-family:var(--f-display); letter-spacing:-.02em; text-wrap:balance; margin:0; line-height:1.15}
h1{font-size:clamp(28px, 3.2vw, 40px); font-weight:700}
h2{font-size:18px; font-weight:600}
h3{font-size:15px; font-weight:600}
.page-head{display:flex; flex-direction:column; gap:6px}
.head-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}

/* ===== controls ===== */
.btn{display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:calc(var(--radius) - 2px); border:1px solid var(--border); background:var(--surface); font-weight:500; font-size:14px; white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent); color:var(--accent-text); border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px; font-size:13px}
.iconbtn{display:inline-grid; place-items:center; width:34px; height:34px; border-radius:9px; color:var(--muted)}
.iconbtn:hover{background:var(--hover); color:var(--text)}
.seg{display:inline-flex; padding:3px; gap:2px; background:var(--surface-2); border-radius:calc(var(--radius) - 1px)}
.seg button{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:calc(var(--radius) - 3px); font-size:13.5px; font-weight:500; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 2px color-mix(in srgb, var(--text) 12%, transparent)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{padding:5px 11px; border-radius:999px; border:1px solid var(--border); font-size:13px; color:var(--muted); background:var(--surface)}
.chip.on{background:var(--text); color:var(--surface); border-color:var(--text)}
.chip .n{font-family:var(--f-mono); font-size:11px; margin-left:4px; opacity:.75}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label,.field .lbl{font-size:12px; color:var(--muted); font-weight:500}
.in, select.in{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:calc(var(--radius) - 3px); background:var(--surface); min-width:0}
.in:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical; min-height:90px; line-height:1.5}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted)}
.toggle i{width:30px; height:18px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); position:relative; transition:background .15s}
.toggle i::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--muted); transition:transform .15s}
.toggle.on i{background:var(--accent); border-color:var(--accent)}
.toggle.on i::after{transform:translateX(12px); background:var(--accent-text)}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.toolbar .spacer{flex:1}

/* ===== panels ===== */
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px}
.panel{border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; background:var(--surface)}
.panel-h{display:flex; align-items:baseline; gap:8px}
.panel-h .count{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.panel-h .more{margin-left:auto; font-size:13px; color:var(--accent); font-weight:500}
.sec{display:flex; flex-direction:column; gap:12px}
.sec-h{display:flex; align-items:baseline; gap:10px}
.sec-h .more{margin-left:auto; font-size:13px; color:var(--accent); font-weight:500}
.empty{padding:22px 16px; border:1px dashed var(--border); border-radius:var(--radius); color:var(--muted); font-size:14px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.empty b{color:var(--text); font-weight:600}

/* ===== tasks ===== */
.tlist{display:flex; flex-direction:column}
.tgroup{display:flex; flex-direction:column; gap:2px}
.tgroup + .tgroup{margin-top:18px}
.tgroup-h{display:flex; align-items:center; gap:8px; padding:0 8px 6px; border-bottom:1px solid var(--border); margin-bottom:4px}
.tgroup-h .count{font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.tgroup-h.over .eyebrow{color:var(--bad)}
.trow{display:flex; align-items:flex-start; gap:11px; padding:calc(8px * var(--d)) 8px; border-radius:8px; cursor:pointer; min-width:0}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--accent-soft)}
.check{width:19px; height:19px; margin-top:2px; border-radius:50%; border:1.6px solid color-mix(in srgb, var(--muted) 80%, transparent); display:grid; place-items:center; flex:none; color:transparent; transition:background .12s, border-color .12s}
.check:hover{border-color:var(--accent); color:color-mix(in srgb, var(--accent) 60%, transparent)}
.check.st-doing{border-color:var(--warn); background:conic-gradient(var(--warn) 0 50%, transparent 0)}
.check.st-done{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.t-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.t-title{overflow-wrap:anywhere}
.is-done .t-title{color:var(--muted); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--muted) 60%, transparent)}
.t-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted)}
.t-meta:empty{display:none}
.meta-i{display:inline-flex; align-items:center; gap:3px}
.t-side{display:flex; align-items:center; gap:8px; flex:none; margin-top:1px}
.pchip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); max-width:180px}
.pchip i{width:8px; height:8px; border-radius:2.5px; background:var(--pc); flex:none}
.pchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.due{font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.due.today{color:var(--accent); font-weight:500}
.due.over{color:var(--bad); font-weight:500}
.prio{display:inline-flex}
.prio.p1{color:var(--muted)} .prio.p2{color:var(--warn)} .prio.p3{color:var(--bad)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill-doing,.ps-active{color:var(--accent); background:var(--accent-soft)}
.ps-idea{color:var(--muted)}
.ps-paused{color:var(--warn); background:color-mix(in srgb, var(--warn) 13%, transparent)}
.ps-done{color:var(--ok); background:color-mix(in srgb, var(--ok) 13%, transparent)}
.addline{display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; color:var(--muted)}
.addline input{flex:1; min-width:0; border:0; background:transparent; padding:4px 0; outline:none}
.addline:focus-within{background:var(--hover); color:var(--text)}

.kanban{display:grid; grid-template-columns:repeat(3, minmax(240px,1fr)); gap:14px; overflow-x:auto; padding-bottom:6px}
.kcol{background:var(--surface-2); border-radius:var(--radius); padding:10px; display:flex; flex-direction:column; gap:8px; min-height:200px; transition:outline-color .15s; outline:2px dashed transparent; outline-offset:-2px}
.kcol.drop{outline-color:var(--accent)}
.kcol-h{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; padding:2px 4px}
.kcol-h .count{margin-left:auto; font-family:var(--f-mono); font-size:12px; color:var(--muted); font-weight:400}
.kdot{width:9px; height:9px; border-radius:50%; background:var(--muted)}
.kdot.st-doing{background:var(--warn)} .kdot.st-done{background:var(--ok)}
.kbody{display:flex; flex-direction:column; gap:8px}
.kcard{background:var(--surface); border:1px solid var(--border); border-radius:calc(var(--radius) - 2px); padding:10px 12px; display:flex; flex-direction:column; gap:7px; cursor:grab; text-align:left}
.kcard:hover{border-color:color-mix(in srgb, var(--accent) 45%, var(--border))}
.kcard.dragging{opacity:.4}
.kcard .t-title{font-weight:500}
.kcard-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.kcard-foot .due{margin-left:auto}
.kempty{font-size:13px; color:var(--muted); text-align:center; padding:14px 0}
.kadd{border:0; background:transparent; padding:7px 6px; border-radius:7px; outline:none; color:var(--text)}
.kadd:focus{background:var(--surface)}
.kadd::placeholder{color:var(--muted)}

/* ===== projects ===== */
.pgridc{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px}
.pcard{border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; background:var(--surface); text-align:left; min-width:0; transition:border-color .15s, transform .15s}
.pcard:hover{border-color:color-mix(in srgb, var(--pc) 55%, var(--border)); transform:translateY(-1px)}
.pcard-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.ptile{width:36px; height:36px; border-radius:calc(var(--radius) - 1px); display:grid; place-items:center; background:color-mix(in srgb, var(--pc) 18%, var(--surface)); color:var(--pc); font-family:var(--f-display); font-weight:700; font-size:17px; flex:none; border:1px solid color-mix(in srgb, var(--pc) 30%, transparent)}
.ptile.big{width:56px; height:56px; font-size:26px; border-radius:calc(var(--radius) + 4px)}
.pcard-name{font-family:var(--f-display); font-weight:600; font-size:18px; letter-spacing:-.015em; line-height:1.2; overflow-wrap:anywhere}
.pcard-due{display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--muted)}
.bar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar span{display:block; height:100%; border-radius:99px; background:var(--pc, var(--accent)); transition:width .3s}
.pcard-foot{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.pcard-next{font-size:13px; color:var(--muted); border-top:1px solid var(--border); padding-top:9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pcard-next b{color:var(--text); font-weight:500}

.crumbs{display:flex}
.crumbs button{display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:13.5px; padding:4px 8px 4px 2px; border-radius:7px}
.crumbs button:hover{color:var(--text)}
.phead{display:flex; gap:16px; align-items:center}
.title-in{flex:1; min-width:0; border:0; background:transparent; font-family:var(--f-display); font-weight:700; font-size:clamp(26px, 3vw, 36px); letter-spacing:-.02em; padding:2px 0; outline:none; resize:none; line-height:1.2; width:100%; overflow:hidden}
.title-in::placeholder{color:color-mix(in srgb, var(--muted) 60%, transparent)}
.props{display:flex; gap:10px 22px; flex-wrap:wrap; align-items:center; padding:12px 0; border-block:1px solid var(--border)}
.prop{display:flex; align-items:center; gap:8px; font-size:13.5px}
.prop .lbl{color:var(--muted); font-size:12.5px}
.prop select,.prop input[type=date]{border:1px solid transparent; background:transparent; padding:4px 6px; border-radius:7px; font-size:13.5px}
.prop select:hover,.prop input[type=date]:hover{border-color:var(--border)}
.prog{display:flex; align-items:center; gap:10px; min-width:180px}
.prog .bar{flex:1; min-width:80px}
.prog span{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.pdetail{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:28px; align-items:start}
.pdetail aside{display:flex; flex-direction:column; gap:18px}

/* ===== notes ===== */
.ngrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px}
.ncard{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:8px; cursor:pointer; background:var(--surface); min-width:0; min-height:132px}
.ncard:hover{border-color:color-mix(in srgb, var(--accent) 40%, var(--border))}
.ncard-t{font-weight:600; font-size:15.5px; display:flex; gap:6px; align-items:flex-start; overflow-wrap:anywhere}
.ncard-t .ic{color:var(--accent); margin-top:3px}
.ncard-x{font-size:13.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.ncard-f{margin-top:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.ncard-f .date{margin-left:auto; font-family:var(--f-mono)}
.tag{font-size:12px; padding:1px 8px; border-radius:99px; background:var(--surface-2); color:var(--muted)}
.tag button{margin-left:3px; color:inherit}
.tagbox{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.tagbox input{border:0; background:transparent; outline:none; width:120px; padding:3px 4px; font-size:13px}
.nrow{display:flex; gap:10px; align-items:center; padding:7px 8px; border-radius:8px; cursor:pointer; min-width:0}
.nrow:hover{background:var(--hover)}
.nrow .ic{color:var(--muted)}
.nrow span:nth-child(2){flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nrow .date{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.search-in{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:var(--radius); padding:0 10px; background:var(--surface); color:var(--muted); min-width:0; flex:1; max-width:360px}
.search-in input{border:0; outline:none; background:transparent; padding:8px 0; flex:1; min-width:0; color:var(--text)}

/* ===== block editor ===== */
.editor{display:flex; flex-direction:column; gap:2px; padding-bottom:40px; font-size:16px; line-height:1.65}
.blk{position:relative; display:flex; align-items:flex-start; gap:8px; padding-left:28px; border-radius:6px}
.blk-handle{position:absolute; left:2px; top:calc(.3em + 1px); width:22px; height:24px; display:grid; place-items:center; color:var(--muted); opacity:0; border-radius:5px; cursor:grab; transition:opacity .12s}
.blk:hover .blk-handle,.blk:focus-within .blk-handle{opacity:.7}
.blk-handle:hover{background:var(--hover); opacity:1}
.bt{flex:1; min-width:0; outline:none; white-space:pre-wrap; overflow-wrap:anywhere; padding:3px 0; min-height:1.65em}
.bt:empty::before{content:attr(data-ph); color:color-mix(in srgb, var(--muted) 65%, transparent); pointer-events:none}
.blk-p .bt:empty:not(:focus)::before{content:""}
.editor.solo .blk-p .bt:empty::before{content:"Zacznij pisać albo wpisz / aby wybrać blok"}
.blk-h1 .bt{font-family:var(--f-display); font-size:1.75em; font-weight:700; letter-spacing:-.02em; line-height:1.25; padding-top:.5em}

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO = () => iso(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const weekEnd = () => addDays((7 - new Date().getDay()) % 7);
const dayDiff = d => Math.round((new Date(d + 'T00:00') - new Date(todayISO() + 'T00:00')) / 864e5);
const fmtShort = d => new Intl.DateTimeFormat('pl-PL', {day:'numeric', month:'short'}).format(new Date(d + 'T00:00'));
const fmtLong = d => new Intl.DateTimeFormat('pl-PL', {day:'numeric', month:'long', year:'numeric'}).format(new Date(d + 'T00:00'));
const fmtWd = d => new Intl.DateTimeFormat('pl-PL', {weekday:'short'}).format(new Date(d + 'T00:00'));

/* ---------- persistence ---------- */
const dirty = new Set(), timers = {}, inflight = {};
function save(c, id, delay = 0) {
  const key = c + '/' + id;
  dirty.add(key);
  clearTimeout(timers[key]);
  timers[key] = setTimeout(() => { delete timers[key]; flush(c, id); }, delay);
}
async function flush(c, id) {
  const key = c + '/' + id;
  if (inflight[key]) { inflight[key].again = true; return; }
  const data = getDoc(c, id);
  if (c === 'settings') lsSet('pracownia-settings-cache', settings);
  if (!data || !db) { if (!timers[key]) dirty.delete(key); return; }
  inflight[key] = {again:false};
  try { await db.doc(key).set(clone(data)); }
  catch (e) { dbError(e); }
  const again = inflight[key].again; delete inflight[key];
  if (again) flush(c, id); else if (!timers[key]) dirty.delete(key);
}
async function removeDoc(c, id) {
  const key = c + '/' + id;
  clearTimeout(timers[key]); delete timers[key];
  store[c].delete(id);
  dirty.add(key);
  if (db) { try { await db.doc(key).delete(); } catch (e) { dbError(e); } }
  dirty.delete(key);
}
function dbError(e) {
  if (e && e.code === 'quota_exceeded') toast('Brak miejsca w bazie. Usuń część starych notatek lub zadań.');
  else if (e && (e.code === 'revoked' || e.code === 'not_granted')) { dbState = 'off'; renderSide(); }
  else if (e && e.code === 'unavailable') toast('Chwilowy problem z zapisem. Spróbuję ponownie przy następnej zmianie.');
}
async function initDb() {
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch { db = null; }
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  try { smp = window.claude?.use ? await window.claude.use('sample') : null; } catch { smp = null; }
  if (!db) { dbState = 'off'; Object.keys(loaded).forEach(k => loaded[k] = true); render(); return; }
  render();
  dbState = 'on';
  for (const c of ['projects','tasks','notes','time']) {
    db.collection(c).onSnapshot(snap => {
      let changed = !loaded[c];
      for (const ch of snap.docChanges()) {
        const id = ch.doc.id, key = c + '/' + id;
        if (dirty.has(key) || ch.doc.metadata.hasPendingWrites) continue;
        if (ch.type === 'removed') { if (store[c].has(id)) { store[c].delete(id); changed = true; } continue; }
        const data = ch.doc.data(), cur = store[c].get(id);
        if (!cur || stable(cur) !== stable(data)) { store[c].set(id, clone(data)); changed = true; }
      }
      loaded[c] = true;
      if (changed) requestRender();
    }, e => { dbError(e); });
  }
  db.doc('settings/app').onSnapshot(s => {
    if (dirty.has('settings/app') || !s.exists) return;
    const d = mergeSettings(s.data());
    if (stable(d) !== stable(settings)) { settings = d; lsSet('pracownia-settings-cache', settings); applySkin(); requestRender(); }
  }, e => dbError(e));
  render();
}

const sysDark = () => { const t = document.documentElement.dataset.theme; if (t === 'dark') return true; if (t === 'light') return false; return matchMedia('(prefers-color-scheme: dark)').matches; };
const resolvedPalette = sk => sk.auto ? (sysDark() ? sk.cd : sk.c) : sk.c;
const VARMAP = {bg:'--bg', surface:'--surface', surface2:'--surface-2', text:'--text', muted:'--muted', border:'--border', accent:'--accent', accentText:'--accent-text'};
function applySkin() {
  const sk = curSkin(), r = document.documentElement.style;
  for (const v of [...Object.values(VARMAP), '--ok','--warn','--bad']) r.removeProperty(v);
  r.removeProperty('color-scheme');
  if (!sk.auto) {
    for (const [k, v] of Object.entries(VARMAP)) if (sk.c[k]) r.setProperty(v, sk.c[k]);
    const dark = lum(sk.c.bg) < .4;
    r.setProperty('color-scheme', dark ? 'dark' : 'light');
    r.setProperty('--ok', dark ? '#5DBE88' : '#2C8553'); r.setProperty('--warn', dark ? '#E2A447' : '#B8730F'); r.setProperty('--bad', dark ? '#EF7A71' : '#C23F38');
